name: Secure CI CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Verificar ficheiro HTML
        run: |
          ls -la

  sast_scan:
    name: SAST - Semgrep Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Executar Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  dast_scan:
    name: DAST - OWASP ZAP Scan
    needs: sast_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar servidor e iniciar
        run: |
          npm install -g serve
          serve . -p 3000 &
          sleep 3

      - name: Executar OWASP ZAP Baseline Scan (DAST via Docker)
        run: |
          docker run --rm -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://172.17.0.1:3000/HelloWorld.html -I || true